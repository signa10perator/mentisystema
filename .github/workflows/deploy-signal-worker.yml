name: Deploy Signal Worker

on:
  push:
    branches: [main]
    paths:
      - "signal/worker/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: signal/worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply D1 schema
        run: npx wrangler d1 execute mentisystema-signal --remote --file=schema.sql
      - name: Set ANTHROPIC_API_KEY secret
        run: echo "${{ secrets.ANTHROPIC_API_KEY }}" | npx wrangler secret put ANTHROPIC_API_KEY
      - name: Deploy Worker
        run: npx wrangler deploy
