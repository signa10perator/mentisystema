name = "mentisystema-signal"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
# Nightly rollup — 09:00 UTC.
crons = ["0 9 * * *"]

[vars]
ALLOWED_ORIGIN = "https://mentisystema.org"

# Created once via the bootstrap workflow (.github/workflows/bootstrap-signal-worker.yml);
# paste the real IDs it prints here before the deploy workflow can run.
[[d1_databases]]
binding = "SIGNAL_DB"
database_name = "mentisystema-signal"
database_id = "bf0f8892-246a-486a-a85e-39839dfd9f05"

[[kv_namespaces]]
binding = "SIGNAL_KV"
id = "e61191282bef4d0bac15091a4f68193a"
