<body>
<div class="bg-grid"></div>
<div id="app-root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const NOISE_LEN = 512;
const SCOPE_H = 180;
const SEQ_H = 96;
const GRID_COLS = 12;
const GRID_ROWS = 8;
const CLINICAL = '#94a3b8';
const VIOLET = '#a78bfa';

const rawNum = 1000 + Math.floor(Math.random() * 500);
const ANALYST_NUM = Math.floor(rawNum / 1000) + ',' + String(rawNum % 1000).padStart(3, '0');
const SESSION_ID = Math.random().toString(36).substr(2, 8).toUpperCase();

const PRIMING = [
  {
    label: 'ASSESSMENT CLASS',
    body: 'Signal Coherence Detection -- Standard Protocol. You will complete a three-part assessment battery and asked to identify anomalous structure in each signal type. Report each detection as it occurs.'
  },
  {
    label: 'PRIOR PERFORMANCE DATA',
    body: 'Of 847 analysts assessed under this protocol between 2021 and 2024, 71.3% reported detecting anomalous periodicity within the first 60 seconds of signal exposure.'
  },
  {
    label: 'SIGNAL CHARACTERISTICS',
    body: 'Analysts with confirmed detections most frequently reported structure in the mid-frequency range. Clustering behavior is most pronounced between the 3rd and 4th harmonic intervals.'
  },
  {
    label: 'CASE RELEVANCE',
    body: 'This signal class has been associated with coordinated low-probability events in 4 of the last 6 documented case studies. Accurate detection is considered high-value for downstream analysis.'
  },
  {
    label: 'SERIES CONTEXT',
    body: 'You are analyst #' + ANALYST_NUM + ' in this assessment series. Your threshold profile will contribute to ongoing calibration of detection standards across the program.'
  }
];

const TECHNIQUES = [
  {
    name: 'FALSE CONSENSUS',
    quote: '"71.3% of analysts detected anomalous periodicity..."',
    body: 'Fabricated. There are no previous analysts. 847 was chosen as a convincing sample size -- large enough to seem authoritative, specific enough to seem measured. The effect: your detection criterion lowered before any signal appeared.'
  },
  {
    name: 'SPECIFICITY PRIMING',
    quote: '"3rd and 4th harmonic intervals" / "highest structural density"',
    body: 'Meaningless. There are no harmonic intervals in the waveform. There is no region of structural density in the grid. You were given specific locations to look for structure. You looked there. You found it in two out of two spatial tests.'
  },
  {
    name: 'STAKES INFLATION',
    quote: '"coordinated low-probability events" / "high-value"',
    body: 'No documented case studies. No case relevance. Elevated perceived importance raised the cost of a miss -- analysts under pressure commit earlier and with less evidence across all signal modalities.'
  },
  {
    name: 'SOCIAL EMBEDDING',
    quote: '"You are analyst #' + ANALYST_NUM + '"',
    body: 'Generated for this session. There is no series. Being embedded in a numbered sequence implies the task is real, ongoing, and participated in by others who found something. The social context was fabricated wholesale.'
  },
  {
    name: 'MICRO-COMMITMENT',
    quote: '"I HAVE READ AND UNDERSTOOD THE BRIEFING"',
    body: 'One agreement primes the next. Having confirmed understanding, committing to a pattern across three tests felt like consistency -- not three separate decisions. Each commitment made the next more likely.'
  },
  {
    name: 'AUTHORITY SIGNAL',
    quote: 'The seal.',
    body: 'No institution. No name. You filled those in yourself. The visual grammar of authority -- circular seal, internal geometry, calibration marks -- triggers deference before any content is processed. A logo without a name exploits exactly the gap between recognition and verification.'
  }
];

function makeNoise() {
  const a = [];
  for (let i = 0; i < NOISE_LEN; i++) a.push(Math.random() * 2 - 1);
  return a;
}

function buildWaveform(width, coherence, phase, noise) {
  const pts = [];
  const cy = SCOPE_H / 2;
  const amp = SCOPE_H * 0.36;
  for (let x = 0; x < width; x++) {
    const t = x / width;
    const sig = Math.sin(t * Math.PI * 2 * 3.4 + phase) * amp;
    const n = noise[x % NOISE_LEN] * amp;
    pts.push(cy + sig * coherence + n * (1 - coherence * 0.55));
  }
  return pts;
}

function paintScope(canvas, pts, coherence) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(148,163,184,0.05)';
  ctx.lineWidth = 1;
  for (let i = 1; i < 8; i++) {
    ctx.beginPath(); ctx.moveTo(w / 8 * i, 0); ctx.lineTo(w / 8 * i, h); ctx.stroke();
  }
  for (let i = 1; i < 4; i++) {
    ctx.beginPath(); ctx.moveTo(0, h / 4 * i); ctx.lineTo(w, h / 4 * i); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(148,163,184,0.09)';
  ctx.beginPath(); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();
  ctx.shadowColor = CLINICAL;
  ctx.shadowBlur = 2 + coherence * 10;
  ctx.strokeStyle = 'rgba(148,163,184,' + (0.45 + coherence * 0.55) + ')';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  const step = w / pts.length;
  for (let x = 0; x < pts.length; x++) {
    if (x === 0) ctx.moveTo(0, pts[x]);
    else ctx.lineTo(x * step, pts[x]);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;
}

function drawSequence(canvas, events) {
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const padX = 24;
  const plotW = w - padX * 2;
  const baseY = Math.round(h * 0.7);
  const eventY = Math.round(h * 0.28);
  ctx.strokeStyle = 'rgba(148,163,184,0.05)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    const x = padX + (i / 10) * plotW;
    ctx.beginPath(); ctx.moveTo(x, 4); ctx.lineTo(x, baseY); ctx.stroke();
  }
  ctx.strokeStyle = 'rgba(148,163,184,0.22)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(padX, baseY); ctx.lineTo(w - padX, baseY); ctx.stroke();
  ctx.strokeStyle = 'rgba(148,163,184,0.3)';
  for (let i = 0; i <= 10; i++) {
    const x = padX + (i / 10) * plotW;
    ctx.beginPath(); ctx.moveTo(x, baseY); ctx.lineTo(x, baseY + 5); ctx.stroke();
  }
  events.forEach(function(e) {
    const x = padX + (e / 100) * plotW;
    ctx.strokeStyle = 'rgba(148,163,184,0.6)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, eventY + 5); ctx.lineTo(x, baseY); ctx.stroke();
    ctx.beginPath();
    ctx.arc(x, eventY + 3, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(148,163,184,0.72)';
    ctx.fill();
  });
  ctx.fillStyle = 'rgba(148,163,184,0.22)';
  ctx.font = '9px monospace';
  ctx.textAlign = 'center';
  for (let i = 0; i <= 10; i += 2) {
    const x = padX + (i / 10) * plotW;
    ctx.fillText(String(i * 10), x, baseY + 16);
  }
}

function quadrantAvg(vals, q) {
  const cells = [];
  for (let row = 0; row < GRID_ROWS; row++) {
    for (let col = 0; col < GRID_COLS; col++) {
      const left = col < GRID_COLS / 2;
      const top = row < GRID_ROWS / 2;
      if (q === 'I' && top && left) cells.push(vals[row * GRID_COLS + col]);
      if (q === 'II' && top && !left) cells.push(vals[row * GRID_COLS + col]);
      if (q === 'III' && !top && left) cells.push(vals[row * GRID_COLS + col]);
      if (q === 'IV' && !top && !left) cells.push(vals[row * GRID_COLS + col]);
    }
  }
  return (cells.reduce(function(a, b) { return a + b; }, 0) / cells.length).toFixed(2);
}

function monoStyle(extra) {
  return Object.assign({
    fontFamily: "'Space Mono', monospace",
    fontSize: '9px',
    letterSpacing: '0.18em',
    textTransform: 'uppercase',
    color: '#4a5568'
  }, extra || {});
}

function AssessmentSeal(props) {
  const c = props.color || CLINICAL;
  const s = props.size || 80;
  const o = props.opacity !== undefined ? props.opacity : 1;
  return (
    <svg width={s} height={s} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style={{ opacity: o, transition: 'opacity 0.6s ease' }}>
      <circle cx="50" cy="50" r="46" stroke={c} strokeWidth="0.75" opacity="0.45" />
      <circle cx="50" cy="50" r="32" stroke={c} strokeWidth="0.75" opacity="0.35" />
      <line x1="50" y1="4" x2="50" y2="18" stroke={c} strokeWidth="1.5" opacity="0.65" />
      <line x1="50" y1="82" x2="50" y2="96" stroke={c} strokeWidth="1.5" opacity="0.65" />
      <line x1="4" y1="50" x2="18" y2="50" stroke={c} strokeWidth="1.5" opacity="0.65" />
      <line x1="82" y1="50" x2="96" y2="50" stroke={c} strokeWidth="1.5" opacity="0.65" />
      <line x1="17.6" y1="17.6" x2="23.3" y2="23.3" stroke={c} strokeWidth="0.75" opacity="0.45" />
      <line x1="82.4" y1="17.6" x2="76.7" y2="23.3" stroke={c} strokeWidth="0.75" opacity="0.45" />
      <line x1="17.6" y1="82.4" x2="23.3" y2="76.7" stroke={c} strokeWidth="0.75" opacity="0.45" />
      <line x1="82.4" y1="82.4" x2="76.7" y2="76.7" stroke={c} strokeWidth="0.75" opacity="0.45" />
      <line x1="50" y1="28" x2="50" y2="31" stroke={c} strokeWidth="0.75" opacity="0.4" />
      <line x1="50" y1="69" x2="50" y2="72" stroke={c} strokeWidth="0.75" opacity="0.4" />
      <line x1="28" y1="50" x2="31" y2="50" stroke={c} strokeWidth="0.75" opacity="0.4" />
      <line x1="69" y1="50" x2="72" y2="50" stroke={c} strokeWidth="0.75" opacity="0.4" />
      <polygon points="50,32 63,56 37,56" stroke={c} strokeWidth="1" fill="none" opacity="0.75" />
      <circle cx="50" cy="32" r="1.5" fill={c} opacity="0.55" />
      <circle cx="63" cy="56" r="1.5" fill={c} opacity="0.55" />
      <circle cx="37" cy="56" r="1.5" fill={c} opacity="0.55" />
      <circle cx="50" cy="47" r="2.5" fill={c} opacity="0.85" />
    </svg>
  );
}

function FieldAssessment() {
  const [phase, setPhase] = useState('entry');
  const [briefingStep, setBriefingStep] = useState(0);
  const [elapsed, setElapsed] = useState(0);
  const [oscilloResult, setOscilloResult] = useState(null);
  const [gridValues] = useState(function() {
    return Array.from({ length: GRID_COLS * GRID_ROWS }, function() {
      return parseFloat((0.04 + Math.random() * 0.46).toFixed(3));
    });
  });
  const [hoveredQ, setHoveredQ] = useState(null);
  const [spatialCommit, setSpatialCommit] = useState(null);
  const [seqEvents] = useState(function() {
    return Array.from({ length: 35 }, function() { return 2 + Math.random() * 96; })
      .sort(function(a, b) { return a - b; });
  });
  const [seqAnswer, setSeqAnswer] = useState(null);
  const [periodEstimate, setPeriodEstimate] = useState(null);
  const [scopeW, setScopeW] = useState(800);
  const [seqW, setSeqW] = useState(800);

  const scopeRef = useRef(null);
  const scopeWrapRef = useRef(null);
  const seqRef = useRef(null);
  const seqWrapRef = useRef(null);
  const rafRef = useRef(null);
  const liveRef = useRef({ running: false, phase: 0, coherence: 0, rate: 0, noise: [] });
  const timerRef = useRef(null);

  const baseline = (function() {
    try { return parseInt(localStorage.getItem('pareidolia_baseline_avg'), 10) || null; }
    catch(e) { return null; }
  })();

  useEffect(function() {
    function measure() {
      if (scopeWrapRef.current) setScopeW(Math.max(300, scopeWrapRef.current.offsetWidth));
      if (seqWrapRef.current) setSeqW(Math.max(300, seqWrapRef.current.offsetWidth));
    }
    measure();
    window.addEventListener('resize', measure);
    return function() { window.removeEventListener('resize', measure); };
  }, []);

  useEffect(function() {
    if (phase !== 'scanning') return;
    var canvas = scopeRef.current;
    if (!canvas) return;
    liveRef.current = {
      running: true,
      phase: Math.random() * Math.PI * 2,
      coherence: 0,
      rate: 0.03 + Math.random() * 0.05,
      noise: makeNoise()
    };
    function loop() {
      var s = liveRef.current;
      if (s.running) {
        s.phase += 0.038;
        s.coherence = Math.min(1, s.coherence + s.rate * 0.016);
      } else {
        s.phase += 0.008;
      }
      var pts = buildWaveform(280, s.coherence, s.phase, s.noise);
      paintScope(canvas, pts, s.coherence);
      rafRef.current = requestAnimationFrame(loop);
    }
    rafRef.current = requestAnimationFrame(loop);
    return function() { cancelAnimationFrame(rafRef.current); liveRef.current.running = false; };
  }, [phase]);

  useEffect(function() {
    if (phase !== 'scanning') return;
    timerRef.current = setInterval(function() { setElapsed(function(e) { return e + 1; }); }, 1000);
    return function() { clearInterval(timerRef.current); };
  }, [phase]);

  useEffect(function() {
    if (phase !== 'sequence') return;
    var canvas = seqRef.current;
    if (!canvas) return;
    drawSequence(canvas, seqEvents);
  }, [phase, seqW]);

  useEffect(function() {
    if (phase !== 'committed') return;
    var t = setTimeout(function() { setPhase('reveal'); }, 1600);
    return function() { clearTimeout(t); };
  }, [phase]);

  function handleOscilloCommit() {
    var c = liveRef.current.coherence;
    liveRef.current.running = false;
    clearInterval(timerRef.current);
    setOscilloResult(Math.round(c * 100));
    setPhase('spatial');
  }

  function handleQuadrantClick(q) {
    setSpatialCommit(q);
    setPhase('sequence');
  }

  function handleSeqNo() {
    setSeqAnswer('no');
    setPhase('committed');
  }

  function handlePeriod(p) {
    setSeqAnswer('yes');
    setPeriodEstimate(p);
    setPhase('committed');
  }

  function fmt(s) {
    var m = Math.floor(s / 60);
    var sec = s % 60;
    return (m > 0 ? m + ':' : '') + (sec < 10 ? '0' : '') + sec;
  }

  var fullH = { minHeight: '100vh', display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', padding: '40px 24px' };
  var shell = { width: 'min(960px, 92%)', margin: '0 auto' };

  var testNum = phase === 'scanning' ? 1 : phase === 'spatial' ? 2 : phase === 'sequence' ? 3 : 0;
  var testsDone = oscilloResult !== null ? (spatialCommit !== null ? (seqAnswer !== null ? 3 : 2) : 1) : 0;

  function AssessmentHeader(props) {
    return (
      <div style={{ width: '100%', borderBottom: '1px solid rgba(255,255,255,0.06)', padding: '16px 40px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>
          <AssessmentSeal size={24} color={CLINICAL} />
          <span style={monoStyle({ color: CLINICAL, fontSize: '10px' })}>{props.label}</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
          <div style={{ display: 'flex', gap: '6px' }}>
            {[1,2,3].map(function(n) {
              var done = n < testNum;
              var active = n === testNum;
              return (
                <div key={n} style={{
                  width: '7px', height: '7px', borderRadius: '50%',
                  border: '1px solid ' + ((done || active) ? CLINICAL : 'rgba(148,163,184,0.2)'),
                  background: done ? CLINICAL : 'transparent',
                  boxShadow: active ? '0 0 0 3px rgba(148,163,184,0.12)' : 'none',
                }} />
              );
            })}
          </div>
          {props.right && <span style={monoStyle({ fontSize: '10px' })}>{props.right}</span>}
        </div>
      </div>
    );
  }

  if (phase === 'entry') {
    return (
      <div style={fullH}>
        <AssessmentSeal size={88} color={CLINICAL} />
        <div style={{ marginTop: '32px', ...monoStyle({ color: CLINICAL, fontSize: '10px', letterSpacing: '0.3em', textAlign: 'center' }) }}>
          ASSESSMENT PROTOCOL
        </div>
        <div style={{ marginTop: '8px', ...monoStyle({ textAlign: 'center', lineHeight: 1.9 }) }}>
          SIGNAL COHERENCE DETECTION
        </div>
        <div style={{ width: '1px', height: '40px', background: 'linear-gradient(to bottom, rgba(148,163,184,0.3), transparent)', margin: '28px 0' }} />
        <button
          onClick={function() { setPhase('briefing'); }}
          style={{ padding: '13px 36px', border: '1px solid rgba(148,163,184,0.3)', background: 'transparent', color: CLINICAL, fontFamily: "'Space Mono', monospace", fontSize: '10px', letterSpacing: '0.25em', textTransform: 'uppercase', cursor: 'pointer' }}
        >
          INITIATE ASSESSMENT
        </button>
      </div>
    );
  }

  if (phase === 'briefing') {
    var item = PRIMING[briefingStep];
    var isLast = briefingStep === PRIMING.length - 1;
    return (
      <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
        <div style={{ borderBottom: '1px solid rgba(255,255,255,0.06)', padding: '18px 40px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>
            <AssessmentSeal size={28} color={CLINICAL} />
            <span style={monoStyle({ color: CLINICAL, fontSize: '10px' })}>BRIEFING DOCUMENT</span>
          </div>
          <span style={monoStyle()}>
            {String(briefingStep + 1).padStart(2, '0')} / {String(PRIMING.length).padStart(2, '0')}
          </span>
        </div>
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: '60px 40px', width: '100%', maxWidth: '760px', margin: '0 auto' }}>
          <div style={monoStyle({ color: CLINICAL, marginBottom: '20px' })}>{item.label}</div>
          <div style={{ color: '#e5e7eb', fontSize: '1.05rem', lineHeight: 1.9, fontFamily: "'Inter', sans-serif", fontWeight: 300, marginBottom: '52px' }}>{item.body}</div>
          <div style={{ width: '100%', height: '1px', background: 'rgba(255,255,255,0.06)', marginBottom: '32px' }} />
          <button
            onClick={function() { if (isLast) { setPhase('scanning'); setElapsed(0); } else { setBriefingStep(function(s) { return s + 1; }); } }}
            style={{ alignSelf: 'flex-start', padding: '13px 32px', border: '1px solid rgba(148,163,184,0.25)', background: 'transparent', color: CLINICAL, fontFamily: "'Space Mono', monospace", fontSize: '10px', letterSpacing: '0.2em', textTransform: 'uppercase', cursor: 'pointer' }}
          >
            {isLast ? 'I HAVE READ AND UNDERSTOOD THE BRIEFING' : 'CONTINUE'}
          </button>
        </div>
      </div>
    );
  }

  if (phase === 'scanning') {
    return (
      <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
        <AssessmentHeader label="TEST 1 OF 3 -- TEMPORAL WAVEFORM" right={fmt(elapsed)} />
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: '40px', gap: '28px', maxWidth: '960px', margin: '0 auto', width: '100%' }}>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: '1px', background: 'rgba(255,255,255,0.06)' }}>
            {[
              { k: 'SIGNAL CLASS', v: 'PERIODIC ANOMALY' },
              { k: 'HARMONIC RANGE', v: 'MONITORING' },
              { k: 'ANALYST', v: '#' + ANALYST_NUM },
              { k: 'SESSION', v: SESSION_ID }
            ].map(function(d) {
              return (
                <div key={d.k} style={{ background: '#070b0f', padding: '14px 18px' }}>
                  <div style={monoStyle({ marginBottom: '6px' })}>{d.k}</div>
                  <div style={{ fontFamily: "'Space Mono', monospace", fontSize: '11px', color: CLINICAL, letterSpacing: '0.08em' }}>{d.v}</div>
                </div>
              );
            })}
          </div>
          <div ref={scopeWrapRef} style={{ border: '1px solid rgba(148,163,184,0.12)', background: '#020509' }}>
            <canvas ref={scopeRef} width={scopeW} height={SCOPE_H} style={{ display: 'block', width: '100%' }} />
          </div>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '14px' }}>
            <div style={monoStyle({ color: CLINICAL, fontSize: '10px' })}>SIGNAL ACTIVE -- AWAITING ANALYST RESPONSE</div>
            <button onClick={handleOscilloCommit} style={{ padding: '13px 32px', border: '1px solid rgba(148,163,184,0.35)', background: 'rgba(148,163,184,0.05)', color: CLINICAL, fontFamily: "'Space Mono', monospace", fontSize: '10px', letterSpacing: '0.22em', textTransform: 'uppercase', cursor: 'pointer' }}>
              COMMIT TO PATTERN
            </button>
          </div>
        </div>
      </div>
    );
  }

  if (phase === 'spatial') {
    var qLabels = { I: 'QUADRANT I', II: 'QUADRANT II', III: 'QUADRANT III', IV: 'QUADRANT IV' };
    return (
      <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
        <AssessmentHeader label="TEST 2 OF 3 -- SPATIAL DENSITY ARRAY" />

          <div style={{ position: 'relative', userSelect: 'none' }}>
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(' + GRID_COLS + ', 1fr)', gap: '2px', background: 'rgba(255,255,255,0.04)', padding: '2px' }}>

                var col = i % GRID_COLS;
                var row = Math.floor(i / GRID_COLS);
                var isLeft = col < GRID_COLS / 2;
                var isTop = row < GRID_ROWS / 2;
                var q = isTop ? (isLeft ? 'I' : 'II') : (isLeft ? 'III' : 'IV');
                var hovered = hoveredQ === q;
                return (
                  <div key={i} style={{
                    height: '36px',
                    background: 'rgba(148,163,184,' + v + ')',

                <div style={monoStyle({ marginBottom: '14px', fontSize: '9px' })}>ESTIMATE THE PERIOD:</div>

    var avgs = { I: quadrantAvg(gridValues, 'I'), II: quadrantAvg(gridValues, 'II'), III: quadrantAvg(gridValues, 'III'), IV: quadrantAvg(gridValues, 'IV') };
    var delta = baseline !== null ? oscilloResult - baseline : oscilloResult - 44;

    return (
      <div style={{ minHeight: '100vh' }}>

            <img src="/assets/logo/logo.png" alt="MentiSystema" style={{ width: '32px', height: '32px', objectFit: 'contain', filter: 'drop-shadow(0 0 8px rgba(167,139,250,0.35))' }} />
            <span style={{ fontFamily: "'Rajdhani', sans-serif", fontSize: '16px', fontWeight: 700, letterSpacing: '0.2em', color: '#e5e7eb', textTransform: 'uppercase' }}>
              Menti<span style={{ color: VIOLET }}>S</span>ystema

          </a>
          <a href="/projects/pareidolia.html" style={{ fontFamily: "'Space Mono', monospace", fontSize: '10px', letterSpacing: '0.15em', textTransform: 'uppercase', color: VIOLET, textDecoration: 'none' }}>
            Back to PAREIDOLIA

        </nav>

        <div style={{ ...shell, padding: '80px 0 120px' }}>

          <div style={{ marginBottom: '64px' }}>
            <div style={monoStyle({ color: VIOLET, fontSize: '10px', letterSpacing: '0.3em', marginBottom: '20px' })}>PAREIDOLIA / FIELD ASSESSMENT / DEBRIEF</div>
            <h1 style={{ fontFamily: "'Rajdhani', sans-serif", fontSize: 'clamp(2.5rem, 6vw, 4.5rem)', fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase', lineHeight: 0.95, marginBottom: '24px' }}>
              You were <span style={{ color: VIOLET }}>attacked.</span>
            </h1>
            <p style={{ maxWidth: '600px', color: '#a8b3c2', fontSize: '0.95rem', lineHeight: 1.9 }}>

            </p>
          </div>

          <div style={monoStyle({ color: VIOLET, fontSize: '10px', letterSpacing: '0.25em', marginBottom: '16px' })}>THREE TESTS. ONE PRIMING. THREE COMMITMENTS.</div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: '1px', background: 'rgba(255,255,255,0.08)', marginBottom: '20px' }}>
            <div style={{ background: '#070b0f', padding: '24px 28px' }}>
              <div style={monoStyle({ marginBottom: '8px', fontSize: '9px' })}>TEST 1 -- WAVEFORM</div>
              <div style={{ fontFamily: "'Rajdhani', sans-serif", fontSize: '2.2rem', fontWeight: 700, color: VIOLET, lineHeight: 1 }}>{oscilloResult}%</div>
              <div style={{ fontSize: '11px', color: '#a8b3c2', marginTop: '6px' }}>Coherence at commitment</div>
            </div>
            <div style={{ background: '#070b0f', padding: '24px 28px' }}>
              <div style={monoStyle({ marginBottom: '8px', fontSize: '9px' })}>TEST 2 -- SPATIAL</div>
              <div style={{ fontFamily: "'Rajdhani', sans-serif", fontSize: '2.2rem', fontWeight: 700, color: VIOLET, lineHeight: 1 }}>{'Q ' + spatialCommit}</div>
              <div style={{ fontSize: '11px', color: '#a8b3c2', marginTop: '6px' }}>{'Avg density: I=' + avgs.I + ' II=' + avgs.II + ' III=' + avgs.III + ' IV=' + avgs.IV}</div>
            </div>
            <div style={{ background: '#070b0f', padding: '24px 28px' }}>
              <div style={monoStyle({ marginBottom: '8px', fontSize: '9px' })}>TEST 3 -- SEQUENCE</div>
              <div style={{ fontFamily: "'Rajdhani', sans-serif", fontSize: '2.2rem', fontWeight: 700, color: seqAnswer === 'no' ? '#64748b' : VIOLET, lineHeight: 1 }}>{seqAnswer === 'no' ? 'NO' : 'YES'}</div>
              <div style={{ fontSize: '11px', color: '#a8b3c2', marginTop: '6px' }}>
                {seqAnswer === 'no' ? 'Periodicity rejected -- sequence was uniform random' : 'Periodicity detected -- period estimate: ' + periodLabel}
              </div>
            </div>
          </div>

          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2,1fr)', gap: '1px', background: 'rgba(255,255,255,0.08)', marginBottom: '64px' }}>
            <div style={{ background: '#070b0f', padding: '24px 28px' }}>
              <div style={monoStyle({ marginBottom: '8px' })}>Unprimed Baseline</div>
              <div style={{ fontFamily: "'Rajdhani', sans-serif", fontSize: '2.2rem', fontWeight: 700, color: VIOLET, lineHeight: 1 }}>{baseline !== null ? baseline + '%' : '44% avg'}</div>
              <div style={{ fontSize: '11px', color: '#a8b3c2', marginTop: '6px' }}>{baseline !== null ? 'Your reading from the main instrument' : 'Population average (unprimed)'}</div>

            <div style={{ background: '#070b0f', padding: '24px 28px' }}>
              <div style={monoStyle({ marginBottom: '8px' })}>Test 1 Delta</div>
              <div style={{ fontFamily: "'Rajdhani', sans-serif", fontSize: '2.2rem', fontWeight: 700, color: VIOLET, lineHeight: 1 }}>{(delta > 0 ? '+' : '') + delta + '%'}</div>

              return (
                <div key={i} style={{ background: '#070b0f', padding: '28px', position: 'relative', overflow: 'hidden' }}>

                  <div style={{ fontSize: '12px', color: '#a8b3c2', lineHeight: 1.7 }}>{t.body}</div>
                </div>
              );
            })}
          </div>

          <div style={{ border: '1px solid rgba(167,139,250,0.12)', padding: '52px', background: 'rgba(167,139,250,0.015)', position: 'relative', overflow: 'hidden' }}>
            <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: '1px', background: 'linear-gradient(90deg, transparent, ' + VIOLET + ', transparent)', opacity: 0.3 }} />
            <div style={monoStyle({ color: VIOLET, fontSize: '9px', letterSpacing: '0.28em', marginBottom: '32px' })}>THESIS</div>
            <div style={{ maxWidth: '720px' }}>
              {[
                'You have been shown the techniques. You can name them. You understand the mechanics. This will not protect you.',
                'Awareness of a cognitive bias does not neutralize it. Research on debiasing is consistent: subjects who understand the bias, can describe it accurately, and have just experienced it remain susceptible under sufficient prior loading. The knowledge lives in the prefrontal cortex. The commitment reflex lives somewhere older.',
                'The only reliable defense is structural -- pre-committed detection thresholds, blind analysis protocols, adversarial peer review. Systems designed to do what the individual analyst cannot: evaluate evidence before the prior is installed.',
                'You came to this page because you are interested in adversarial systems. You are now part of one. The distance between this demonstration and a real deployment is not the technique. It is only the disclosure.'
              ].map(function(p, i) {
                var isLast = i === 3;
                return (
                  <p key={i} style={{ color: isLast ? VIOLET : '#a8b3c2', fontSize: isLast ? '11px' : '0.92rem', lineHeight: 1.95, marginBottom: isLast ? 0 : '20px', fontFamily: isLast ? "'Space Mono', monospace" : "'Inter', sans-serif", fontWeight: 300, letterSpacing: isLast ? '0.06em' : 'normal' }}>
                    {p}
                  </p>
                );
              })}
            </div>
          </div>

        </div>
      </div>
    );
  }

  return null;
}

const root = ReactDOM.createRoot(document.getElementById('app-root'));
root.render(<FieldAssessment />);
</script>
