<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1099 Quarterly Tax Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
/** @jsxRuntime classic */
    const { useState } = React;

    const TrashIcon = () => <span className="text-base leading-none">x</span>;
    const PlusIcon = () => <span className="text-lg font-bold leading-none">+</span>;
    const ChevDownIcon = () => <span className="text-sm">v</span>;
    const ChevUpIcon = () => <span className="text-sm">^</span>;

    export default function BudgetApp() {
      const [incomeMode, setIncomeMode] = useState('annual');
      const [annualIncome, setAnnualIncome] = useState(150000);
      const [weeklyPay, setWeeklyPay] = useState(0);
      const [bills, setBills] = useState([]);
      const [billForm, setBillForm] = useState({ name: '', amount: '', dueDate: '' });
      const [deductions, setDeductions] = useState({
        mileage: 0, homeOffice: 0, tools: 0,
        healthInsurance: 0, professional: 0, other: 0
      });
      const [expandDeductions, setExpandDeductions] = useState(false);
      const [filingStatus, setFilingStatus] = useState('single');

      const grossIncome = incomeMode === 'weekly' ? weeklyPay * 52 : annualIncome;

      const TAX_BRACKETS_SINGLE = [
        { rate: 0.10, min: 0, max: 12400 },
        { rate: 0.12, min: 12400, max: 50400 },
        { rate: 0.22, min: 50400, max: 105700 },
        { rate: 0.24, min: 105700, max: 201775 },
        { rate: 0.32, min: 201775, max: 256225 },
        { rate: 0.35, min: 256225, max: 640600 },
        { rate: 0.37, min: 640600, max: Infinity }
      ];

      const TAX_BRACKETS_MARRIED = [
        { rate: 0.10, min: 0, max: 24800 },
        { rate: 0.12, min: 24800, max: 100800 },
        { rate: 0.22, min: 100800, max: 211400 },
        { rate: 0.24, min: 211400, max: 403550 },
        { rate: 0.32, min: 403550, max: 512450 },
        { rate: 0.35, min: 512450, max: 768900 },
        { rate: 0.37, min: 768900, max: Infinity }
      ];

      const TAX_BRACKETS = filingStatus === 'single' ? TAX_BRACKETS_SINGLE : TAX_BRACKETS_MARRIED;
      const STANDARD_DEDUCTION = filingStatus === 'single' ? 16100 : 32200;

      const mileageDeduction = (deductions.mileage || 0) * 0.725;
      const totalDeductions = mileageDeduction + deductions.homeOffice + deductions.tools +
        deductions.healthInsurance + deductions.professional + deductions.other;

      const netSEIncome = grossIncome - totalDeductions;
      const seTaxBase = netSEIncome * 0.9235;
      const seTax = seTaxBase * 0.153;
      const seDeduction = seTax * 0.5;

      const taxableIncome = Math.max(0, netSEIncome - STANDARD_DEDUCTION - seDeduction);

      let federalTax = 0;
      let taxableAmount = taxableIncome;
      for (let bracket of TAX_BRACKETS) {
        if (taxableAmount <= 0) break;
        const taxInBracket = Math.min(taxableAmount, bracket.max - bracket.min);
        federalTax += taxInBracket * bracket.rate;
        taxableAmount -= taxInBracket;
      }

      const totalTaxes = seTax + federalTax;
      const netIncome = grossIncome - totalTaxes - totalDeductions;
      const weeklyNet = netIncome / 52;
      const quarterlyPayment = Math.round((totalTaxes / 4) * 100) / 100;

      const totalBills = bills.reduce((sum, bill) => sum + parseFloat(bill.amount || 0), 0);
      const remainingBudget = weeklyNet - totalBills;

      const handleAddBill = () => {
        if (billForm.name && billForm.amount && billForm.dueDate) {
          setBills([...bills, { ...billForm, id: Date.now() }]);
          setBillForm({ name: '', amount: '', dueDate: '' });
        }
      };

      const handleDeleteBill = (id) => setBills(bills.filter(b => b.id !== id));

      const sortedBills = [...bills].sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));

      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 p-6">
          <div className="max-w-5xl mx-auto">

            <div className="mb-8">
              <h1 className="text-4xl font-bold text-slate-900 mb-2">1099 Quarterly Tax Planner</h1>
              <p className="text-slate-600">Calculate self-employment taxes and quarterly payments</p>
            </div>

            {/* Income Input */}
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6">
              <div className="flex gap-4 mb-6">
                <button
                  onClick={() => setIncomeMode('annual')}
                  className={`px-5 py-2 rounded-lg font-medium text-sm transition-colors ${incomeMode === 'annual' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                >
                  Annual Income
                </button>
                <button
                  onClick={() => setIncomeMode('weekly')}
                  className={`px-5 py-2 rounded-lg font-medium text-sm transition-colors ${incomeMode === 'weekly' ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                >
                  Weekly Pay
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {incomeMode === 'annual' ? (
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-2">Annual Gross Income</label>
                    <div className="relative">
                      <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">$</span>
                      <input
                        type="number"
                        value={annualIncome}
                        onChange={(e) => setAnnualIncome(parseFloat(e.target.value) || 0)}
                        className="w-full pl-8 pr-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-lg"
                      />
                    </div>
                  </div>
                ) : (
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-2">Weekly Pay (Gross)</label>
                    <div className="relative">
                      <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">$</span>
                      <input
                        type="number"
                        value={weeklyPay}
                        onChange={(e) => setWeeklyPay(parseFloat(e.target.value) || 0)}
                        className="w-full pl-8 pr-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent text-lg"
                        placeholder="Enter weekly pay"
                      />
                    </div>
                    <p className="text-sm text-slate-500 mt-2">Annual equivalent: ${(weeklyPay * 52).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</p>
                  </div>
                )}
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-2">Filing Status</label>
                  <select
                    value={filingStatus}
                    onChange={(e) => setFilingStatus(e.target.value)}
                    className="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                  >
                    <option value="single">Single</option>
                    <option value="married">Married Filing Jointly</option>
                  </select>
                </div>
              </div>
            </div>

            {/* Business Deductions */}
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6">
              <button
                onClick={() => setExpandDeductions(!expandDeductions)}
                className="w-full flex items-center justify-between mb-4 hover:bg-slate-50 p-3 rounded-lg transition"
              >
                <h2 className="text-xl font-semibold text-slate-900">Business Deductions</h2>
                {expandDeductions ? <ChevUpIcon /> : <ChevDownIcon />}
              </button>

              {expandDeductions && (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 p-4 bg-slate-50 rounded-lg border border-slate-200">
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-2">Mileage (miles driven)</label>
                    <div className="flex gap-2 items-center">
                      <input
                        type="number"
                        value={deductions.mileage}
                        onChange={(e) => setDeductions({...deductions, mileage: parseFloat(e.target.value) || 0})}
                        placeholder="Miles"
                        className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                      />
                      <span className="text-slate-600 whitespace-nowrap text-sm">${(deductions.mileage * 0.725).toFixed(2)}</span>
                    </div>
                    <p className="text-xs text-slate-500 mt-1">$0.725/mile</p>
                  </div>
                  {[
                    ['homeOffice', 'Home Office'],
                    ['tools', 'Tools and Equipment'],
                    ['healthInsurance', 'Health Insurance'],
                    ['professional', 'Professional Services (CPA, etc.)'],
                    ['other', 'Other Deductions']
                  ].map(([key, label]) => (
                    <div key={key}>
                      <label className="block text-sm font-medium text-slate-700 mb-2">{label}</label>
                      <div className="relative">
                        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">$</span>
                        <input
                          type="number"
                          value={deductions[key]}
                          onChange={(e) => setDeductions({...deductions, [key]: parseFloat(e.target.value) || 0})}
                          placeholder="Annual amount"
                          className="w-full pl-8 pr-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                        />
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {totalDeductions > 0 && (
                <div className="mt-4 p-4 bg-blue-50 rounded-lg border border-blue-200">
                  <p className="text-sm text-blue-700 mb-1">Total Deductions</p>
                  <p className="text-2xl font-bold text-blue-600">${totalDeductions.toFixed(2)}</p>
                </div>
              )}
            </div>

            {/* Tax Breakdown */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
              <div className="bg-red-50 rounded-xl shadow-sm border border-red-200 p-6">
                <h3 className="text-lg font-semibold text-red-900 mb-4">Self-Employment Tax</h3>
                <div className="space-y-3 text-sm">
                  <div className="flex justify-between">
                    <span className="text-red-800">Net SE Income:</span>
                    <span className="font-semibold text-red-600">${netSEIncome.toFixed(2)}</span>
                  </div>
                  <div className="flex justify-between border-t border-red-200 pt-3">
                    <span className="text-red-800">SE Tax (15.3%):</span>
                    <span className="font-semibold text-red-600">${seTax.toFixed(2)}</span>
                  </div>
                  <p className="text-xs text-red-700">Covers Social Security and Medicare</p>
                </div>
              </div>
              <div className="bg-orange-50 rounded-xl shadow-sm border border-orange-200 p-6">
                <h3 className="text-lg font-semibold text-orange-900 mb-4">Federal Income Tax</h3>
                <div className="space-y-3 text-sm">
                  <div className="flex justify-between">
                    <span className="text-orange-800">Taxable Income:</span>
                    <span className="font-semibold text-orange-600">${taxableIncome.toFixed(2)}</span>
                  </div>
                  <div className="flex justify-between border-t border-orange-200 pt-3">
                    <span className="text-orange-800">Federal Tax:</span>
                    <span className="font-semibold text-orange-600">${federalTax.toFixed(2)}</span>
                  </div>
                  <p className="text-xs text-orange-700">Standard deduction: ${STANDARD_DEDUCTION.toLocaleString()}</p>
                </div>
              </div>
            </div>

            {/* Quarterly Payments */}
            <div className="bg-green-50 rounded-xl shadow-sm border-2 border-green-500 p-6 mb-6">
              <h3 className="text-2xl font-bold text-green-900 mb-4">Quarterly Tax Payments</h3>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                {['Q1 (Apr 15)', 'Q2 (Jun 16)', 'Q3 (Sep 15)', 'Q4 (Jan 15)'].map((q, i) => (
                  <div key={i} className="bg-white rounded-lg p-4 border border-green-200">
                    <p className="text-sm font-medium text-green-800 mb-2">{q}</p>
                    <p className="text-2xl font-bold text-green-600">${quarterlyPayment.toFixed(2)}</p>
                  </div>
                ))}
              </div>
              <div className="pt-4 border-t border-green-200 flex justify-between items-center">
                <span className="text-lg font-semibold text-green-900">Total Annual Taxes:</span>
                <span className="text-3xl font-bold text-green-600">${totalTaxes.toFixed(2)}</span>
              </div>
            </div>

            {/* Net Income */}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
              <div className="bg-slate-50 rounded-xl shadow-sm border border-slate-200 p-6">
                <p className="text-sm text-slate-600 mb-1">Annual Net Income</p>
                <p className="text-3xl font-bold text-slate-900">${netIncome.toFixed(2)}</p>
              </div>
              <div className="bg-slate-50 rounded-xl shadow-sm border border-slate-200 p-6">
                <p className="text-sm text-slate-600 mb-1">Weekly Net Income</p>
                <p className="text-3xl font-bold text-slate-900">${weeklyNet.toFixed(2)}</p>
              </div>
              <div className="bg-slate-50 rounded-xl shadow-sm border border-slate-200 p-6">
                <p className="text-sm text-slate-600 mb-1">Quarterly Income (13 wks)</p>
                <p className="text-3xl font-bold text-slate-900">${(weeklyNet * 13).toFixed(2)}</p>
              </div>
            </div>

            {/* Weekly Bills */}
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6">
              <h2 className="text-xl font-semibold text-slate-900 mb-6">Weekly Bills</h2>
              <div className="bg-slate-50 rounded-lg p-6 mb-6 border border-slate-200">
                <h3 className="font-semibold text-slate-900 mb-4">Add New Bill</h3>
                <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                  <input
                    type="text"
                    placeholder="Bill name"
                    value={billForm.name}
                    onChange={(e) => setBillForm({...billForm, name: e.target.value})}
                    className="px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                  />
                  <div className="relative">
                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500">$</span>
                    <input
                      type="number"
                      placeholder="Amount"
                      value={billForm.amount}
                      onChange={(e) => setBillForm({...billForm, amount: e.target.value})}
                      className="w-full pl-8 pr-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                    />
                  </div>
                  <input
                    type="date"
                    value={billForm.dueDate}
                    onChange={(e) => setBillForm({...billForm, dueDate: e.target.value})}
                    className="px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500"
                  />
                  <button
                    onClick={handleAddBill}
                    className="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors flex items-center justify-center gap-2 font-medium"
                  >
                    <PlusIcon /> Add
                  </button>
                </div>
              </div>

              {sortedBills.length > 0 ? (
                <div className="space-y-2 mb-6">
                  {sortedBills.map((bill) => (
                    <div key={bill.id} className="flex items-center justify-between p-4 bg-slate-50 rounded-lg border border-slate-200">
                      <div>
                        <span className="font-semibold text-slate-900">{bill.name}</span>
                        <span className="text-sm text-slate-500 ml-3">
                          {new Date(bill.dueDate).toLocaleDateString('en-US', {month: 'short', day: 'numeric'})}
                        </span>
                      </div>
                      <div className="flex items-center gap-4">
                        <span className="text-lg font-semibold text-slate-900">${parseFloat(bill.amount).toFixed(2)}</span>
                        <button
                          onClick={() => handleDeleteBill(bill.id)}
                          className="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-lg transition-colors"
                        >
                          <TrashIcon />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="text-center py-12 text-slate-400 mb-6">No bills added yet.</div>
              )}

              {bills.length > 0 && (
                <div className="pt-6 border-t border-slate-200">
                  <div className="bg-slate-50 rounded-lg p-4 border border-slate-200">
                    <p className="text-sm text-slate-600 mb-1">Total Weekly Bills</p>
                    <p className="text-3xl font-bold text-slate-900">${totalBills.toFixed(2)}</p>
                  </div>
                </div>
              )}
            </div>

            {/* Remaining Budget */}
            <div className={`rounded-xl shadow-sm border-2 p-6 ${remainingBudget >= 0 ? 'bg-green-50 border-green-500' : 'bg-red-50 border-red-500'}`}>
              <p className={`text-sm font-medium mb-2 ${remainingBudget >= 0 ? 'text-green-700' : 'text-red-700'}`}>
                REMAINING WEEKLY BUDGET
              </p>
              <p className={`text-4xl font-bold ${remainingBudget >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                ${remainingBudget.toFixed(2)}
              </p>
              {remainingBudget < 0 && (
                <p className="text-sm text-red-600 mt-2">
                  Bills exceed weekly income by ${Math.abs(remainingBudget).toFixed(2)}
                </p>
              )}
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BudgetApp />);
  </script>
</body>
</html>
