<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>anemoia</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Space+Mono:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ── CSS VARIABLES — shift with depth ─────────────────────────── */
:root {
  --bg: #f2ece0;
  --ink: #0e0c0a;
  --mid: rgba(14,12,10,0.38);
  --border: rgba(14,12,10,0.1);
  --accent: #7a3a1e;
  --surface: rgba(14,12,10,0.04);
  --pale: #f2ece0;
}
/* depth levels applied to body */
body.d1 { --bg:#f2ece0; --ink:#0e0c0a; --mid:rgba(14,12,10,0.38); --border:rgba(14,12,10,0.1); --accent:#7a3a1e; --surface:rgba(14,12,10,0.04); }
body.d2 { --bg:#e0ddd4; --ink:#0e0c0a; --mid:rgba(14,12,10,0.42); --border:rgba(14,12,10,0.13); --accent:#5a3020; --surface:rgba(14,12,10,0.06); }
body.d3 { --bg:#1a1a20; --ink:#c8c4bc; --mid:rgba(200,196,188,0.35); --border:rgba(200,196,188,0.1); --accent:#8a7a6a; --surface:rgba(255,255,255,0.04); }
body.d4 { --bg:#060608; --ink:#909090; --mid:rgba(144,144,144,0.3); --border:rgba(144,144,144,0.08); --accent:#505050; --surface:rgba(255,255,255,0.03); }

html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  min-height: 100vh;
  overflow-x: hidden;
  cursor: crosshair;
  transition: background 1.8s cubic-bezier(0.4,0,0.2,1), color 1.8s;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
  opacity: 0.04; pointer-events: none; z-index: 9000;
}

/* screens */
.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; }

/* ── INTRO ──────────────────────────────────────────── */
#intro {
  flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 5rem 2rem; gap: 0;
}
.intro-title {
  font-family: 'EB Garamond', serif; font-style: italic;
  font-size: clamp(4.5rem, 14vw, 10rem); font-weight: 400;
  line-height: 0.88; color: var(--ink); margin-bottom: 1.2rem;
  opacity: 0; animation: riseIn 1.4s 0.2s forwards;
}
.intro-def {
  font-size: 9px; letter-spacing: 0.35em; color: var(--mid);
  margin-bottom: 2.8rem; opacity: 0; animation: riseIn 1s 0.9s forwards;
}
.intro-rule {
  width: 24px; height: 1px; background: var(--mid);
  margin: 0 auto 2.8rem; opacity: 0; animation: riseIn 1s 1.4s forwards;
}
.btn-begin {
  font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.4em;
  text-transform: uppercase; color: var(--mid); background: transparent;
  border: none; padding: 0.5rem 0; cursor: crosshair;
  transition: color 0.3s; opacity: 0; animation: riseIn 1s 1.8s forwards;
}
.btn-begin:hover { color: var(--ink); }

/* ── QUESTIONS ──────────────────────────────────────── */
#questions { flex-direction: column; }
.q-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.6rem 2.5rem; border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--bg); z-index: 100;
  transition: background 1.8s, border-color 1.8s;
}
.q-logo {
  font-family: 'EB Garamond', serif; font-style: italic;
  font-size: 1rem; color: var(--mid); transition: color 1.8s;
}
.q-prog-wrap { flex: 1; max-width: 200px; margin: 0 2rem; }
.q-prog-bar { height: 1px; background: var(--border); position: relative; transition: background 1.8s; }
.q-prog-fill {
  position: absolute; top: 0; left: 0; height: 100%;
  background: var(--ink); transition: width 0.8s cubic-bezier(0.4,0,0.2,1), background 1.8s;
}
.q-num { font-size: 9px; letter-spacing: 0.3em; color: var(--mid); transition: color 1.8s; }

.q-body {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 3rem 1.5rem;
  max-width: 820px; margin: 0 auto; width: 100%;
}

/* image */
.q-img-wrap { width: 100%; position: relative; margin-bottom: 2.5rem; overflow: hidden; }
.q-img-wrap svg, .q-img-wrap img { display: block; width: 100%; height: 240px; object-fit: cover; }
.q-img-caption {
  position: absolute; bottom: 0.8rem; right: 1rem;
  font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(255,255,255,0.35); transition: color 1.8s;
}
body.d1 .q-img-caption, body.d2 .q-img-caption { color: rgba(14,12,10,0.3); }
.q-img-wrap::after {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.45) 100%);
  pointer-events: none;
}

/* depth filter on images — increases with depth */
body.d1 .q-img-wrap svg { filter: sepia(0.6) contrast(0.88) brightness(0.88); }
body.d2 .q-img-wrap svg { filter: sepia(0.4) contrast(0.9) brightness(0.78) saturate(0.6); }
body.d3 .q-img-wrap svg { filter: sepia(0.1) contrast(1.0) brightness(0.6) saturate(0.2); }
body.d4 .q-img-wrap svg { filter: brightness(0.45) contrast(1.1) saturate(0); }

.q-prompt {
  font-family: 'EB Garamond', serif; font-style: italic;
  font-size: clamp(1.2rem, 3vw, 1.6rem); line-height: 1.55;
  text-align: center; color: var(--ink); margin-bottom: 0.6rem;
  transition: color 1.8s;
}
.q-hint { font-size: 9px; letter-spacing: 0.2em; color: var(--mid); text-align: center; margin-bottom: 2.5rem; transition: color 1.8s; }

.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; width: 100%; background: var(--border); transition: background 1.8s; }
.choice {
  background: var(--bg); border: none; padding: 1.4rem 1.5rem;
  cursor: crosshair; text-align: left; position: relative; overflow: hidden;
  transition: background 1.8s;
}
.choice::before {
  content: ''; position: absolute; inset: 0; background: var(--ink);
  transform: translateX(-100%); transition: transform 0.35s cubic-bezier(0.4,0,0.2,1), background 1.8s;
}
.choice:hover::before { transform: translateX(0); }
.choice-key {
  font-size: 9px; letter-spacing: 0.38em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 0.5rem;
  position: relative; z-index: 1; transition: color 0.25s;
}
.choice-body {
  font-family: 'EB Garamond', serif; font-size: 1rem; line-height: 1.6;
  color: var(--ink); position: relative; z-index: 1; transition: color 0.25s;
}
.choice:hover .choice-key { color: rgba(255,255,255,0.4); }
.choice:hover .choice-body { color: rgba(255,255,255,0.92); }
.choice.selected { background: var(--ink) !important; }
.choice.selected::before { transform: translateX(0); }
.choice.selected .choice-key { color: rgba(255,255,255,0.4); }
.choice.selected .choice-body { color: rgba(255,255,255,0.92); }
/* the wrong choice — only in d4 */
.choice.wrong .choice-body { color: rgba(160,80,60,0.55); font-style: italic; }
.choice.wrong:hover::before { transform: none; }
.choice.wrong:hover .choice-body { color: rgba(180,90,65,0.8); }

.q-nav { display: flex; justify-content: flex-end; width: 100%; margin-top: 2rem; }
.btn-next {
  font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.35em;
  text-transform: uppercase; color: var(--bg); background: var(--ink);
  border: none; padding: 0.9rem 2rem; cursor: crosshair;
  opacity: 0; transition: opacity 0.4s, background 1.8s, color 1.8s; pointer-events: none;
}
.btn-next.visible { opacity: 1; pointer-events: all; }

/* ── INTERSTITIAL ───────────────────────────────────── */
#interstitial {
  flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 4rem 2rem; background: var(--bg);
  transition: background 1.8s;
}
.inter-line {
  font-family: 'EB Garamond', serif; font-style: italic;
  font-size: clamp(1.3rem, 3.5vw, 2rem); color: var(--ink);
  line-height: 1.6; max-width: 480px; margin-bottom: 1rem;
  opacity: 0; animation: riseIn 2s 0.5s forwards;
  transition: color 1.8s;
}
.inter-sub {
  font-size: 9px; letter-spacing: 0.35em; text-transform: uppercase;
  color: var(--mid); margin-top: 2.5rem;
  opacity: 0; animation: riseIn 1s 2.5s forwards;
  transition: color 1.8s;
}
.btn-continue {
  font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.35em;
  text-transform: uppercase; color: var(--mid); background: transparent;
  border: 1px solid var(--border); padding: 0.9rem 2rem; cursor: crosshair;
  margin-top: 3rem; transition: color 0.3s, border-color 0.3s, background 1.8s;
  opacity: 0; animation: riseIn 1s 3.2s forwards;
}
.btn-continue:hover { color: var(--ink); border-color: var(--ink); }

/* ── RESULT ─────────────────────────────────────────── */
#result {
  flex-direction: column; align-items: center;
  padding: 5rem 2rem 4rem; background: var(--bg);
  transition: background 1.8s;
}
.result-pre {
  font-size: 9px; letter-spacing: 0.5em; text-transform: uppercase;
  color: var(--accent); margin-bottom: 1.8rem; transition: color 1.8s;
}
.result-name {
  font-family: 'EB Garamond', serif; font-style: italic;
  font-size: clamp(3rem, 10vw, 6.5rem); font-weight: 400; line-height: 0.95;
  color: var(--ink); text-align: center; margin-bottom: 0.6rem; transition: color 1.8s;
}
.result-tag {
  font-size: 9px; letter-spacing: 0.35em; text-transform: uppercase;
  color: var(--mid); margin-bottom: 3rem; transition: color 1.8s;
}
.result-rule { width: 40px; height: 1px; background: var(--border); margin: 0 auto 3rem; transition: background 1.8s; }
.result-reflection {
  max-width: 560px; font-family: 'EB Garamond', serif; font-style: italic;
  font-size: clamp(1.05rem, 2.3vw, 1.25rem); line-height: 1.95;
  color: var(--ink); text-align: center; margin-bottom: 1.5rem; transition: color 1.8s;
}
.result-footnote {
  font-size: 10px; letter-spacing: 0.12em; color: var(--mid);
  max-width: 560px; text-align: center; margin-bottom: 3rem;
  line-height: 1.8; transition: color 1.8s;
}
.result-axes {
  display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
  max-width: 560px; width: 100%; background: var(--border);
  margin-bottom: 3rem; transition: background 1.8s;
}
.axis-card { background: var(--bg); padding: 1.4rem; transition: background 1.8s; }
.axis-lbl { font-size: 9px; letter-spacing: 0.38em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.5rem; transition: color 1.8s; }
.axis-val { font-family: 'EB Garamond', serif; font-size: 1rem; color: var(--ink); margin-bottom: 0.4rem; transition: color 1.8s; }
.axis-desc { font-size: 11px; color: var(--mid); line-height: 1.7; transition: color 1.8s; }
.loading-wrap { max-width: 560px; text-align: center; padding: 2.5rem 0; }
.loading-line { font-size: 10px; letter-spacing: 0.28em; color: var(--mid); transition: color 1.8s; }
.loading-dots span { animation: blink 1.4s infinite; opacity: 0; }
.loading-dots span:nth-child(2){animation-delay:.2s}
.loading-dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:0}40%{opacity:1}}
.btn-again {
  font-family: 'Space Mono', monospace; font-size: 9px; letter-spacing: 0.35em;
  text-transform: uppercase; color: var(--mid); background: transparent;
  border: 1px solid var(--border); padding: 0.8rem 2rem; cursor: crosshair;
  transition: color 0.3s, border-color 0.3s, background 1.8s;
}
.btn-again:hover { color: var(--ink); border-color: var(--ink); }

/* ── DEPTH INDICATOR — subtle ───────────────────────── */
#depth-indicator {
  position: fixed; right: 2rem; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px; z-index: 200;
  opacity: 0; transition: opacity 0.6s;
}
#depth-indicator.visible { opacity: 1; }
.depth-pip {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--border); transition: background 0.6s, transform 0.3s;
}
.depth-pip.active { background: var(--accent); transform: scale(1.5); }

/* ── ANIMATIONS ─────────────────────────────────────── */
@keyframes riseIn { 0%{opacity:0;transform:translateY(14px)} 100%{opacity:1;transform:translateY(0)} }
@keyframes glitch {
  0%,94%,100%{clip-path:none;transform:none}
  95%{clip-path:polygon(0 20%,100% 20%,100% 40%,0 40%);transform:translateX(-4px)}
  97%{clip-path:polygon(0 60%,100% 60%,100% 80%,0 80%);transform:translateX(3px)}
  99%{clip-path:none;transform:translateX(1px)}
}
.glitch { animation: glitch 10s infinite; }

/* static flash */
@keyframes staticPop { 0%,100%{opacity:0} 50%{opacity:1} }
.static-layer {
  position: fixed; inset: 0; z-index: 9500; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.8'/%3E%3C/svg%3E");
  opacity: 0; mix-blend-mode: overlay;
}
.static-layer.pop { animation: staticPop 0.15s forwards; }

#overlay {
  position: fixed; inset: 0; background: #060608;
  z-index: 10000; pointer-events: none; opacity: 0; transition: opacity 0.5s;
}
#overlay.on { opacity: 1; }

@media(max-width:600px){
  .choices{grid-template-columns:1fr}
  .result-axes{grid-template-columns:1fr}
  .q-header{padding:1.2rem}
  .q-prog-wrap{margin:0 1rem}
  #depth-indicator{display:none}
}
</style>
</head>
<body class="d1">

<div id="overlay"></div>
<div class="static-layer" id="static"></div>

<div id="depth-indicator">
  <div class="depth-pip active" id="pip0"></div>
  <div class="depth-pip" id="pip1"></div>
  <div class="depth-pip" id="pip2"></div>
  <div class="depth-pip" id="pip3"></div>
</div>

<!-- INTRO -->
<div id="intro" class="screen active">
  <div class="intro-title">anemoia</div>
  <div class="intro-def">n. &nbsp;&middot;&nbsp; nostalgia for a time you've never known</div>
  <div class="intro-rule"></div>
  <button class="btn-begin" onclick="startTest()">enter</button>
</div>

<!-- QUESTIONS -->
<div id="questions" class="screen">
  <div class="q-header">
    <div class="q-logo">anemoia</div>
    <div class="q-prog-wrap"><div class="q-prog-bar"><div class="q-prog-fill" id="prog"></div></div></div>
    <div class="q-num" id="qnum">1 / 8</div>
  </div>
  <div class="q-body">
    <div class="q-img-wrap" id="qimg"></div>
    <div class="q-prompt" id="qprompt"></div>
    <div class="q-hint" id="qhint"></div>
    <div class="choices" id="choices"></div>
    <div class="q-nav"><button class="btn-next" id="btn-next" onclick="advance()">continue &rarr;</button></div>
  </div>
</div>

<!-- INTERSTITIAL -->
<div id="interstitial" class="screen">
  <div class="inter-line" id="inter-line"></div>
  <div class="inter-sub" id="inter-sub"></div>
  <button class="btn-continue" onclick="resumeTest()">continue</button>
</div>

<!-- RESULT -->
<div id="result" class="screen">
  <div class="result-pre" id="result-pre">your type</div>
  <div class="result-name" id="rname"></div>
  <div class="result-tag" id="rtag"></div>
  <div class="result-rule"></div>
  <div id="reflect-wrap">
    <div class="loading-wrap">
      <div class="loading-line">composing your reflection<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></div>
    </div>
  </div>
  <div class="result-footnote" id="rfootnote"></div>
  <div class="result-axes" id="raxes"></div>
  <button class="btn-again" onclick="restart()">begin again</button>
</div>

// ── TYPES ─────────────────────────────────────────────────────────────
function getType(a1,a2) {
  if (Math.abs(a1)<=1 && Math.abs(a2)<=1) return {
    name:'The Drifter', tag:'belonging to the sensation, not its object',
    pre:'your type', footnote:'The instrument notes this type is the rarest. Or the most defended.',
    a1l:'Unanchored', a1d:'Your longing does not land. No era or place claims it. The feeling is the only fixed point.',
    a2l:'Diffuse', a2d:'Neither the individual life nor the collective loss. It slips between categories.',
    prompt:`The person is "The Drifter." Their anemoia is pure and unanchored. They experience the sensation of longing itself as the primary phenomenon — directionless, arriving without cause or object. Write a 3-4 sentence second-person reflection that feels like it was written before they took the test. Quiet, slightly cold, precise. No comfort. No generic phrases. Begin directly.`
  };
  const era=a1>=0, soc=a2>=0;
  if (era&&soc) return {
    name:'The Archivist', tag:'haunted by strangers in specific times',
    pre:'your type', footnote:'The instrument has encountered this type before. Many times. They tend not to believe that.',
    a1l:'Era-drawn', a1d:'Particular decades exert a gravitational pull. Their light, textures, the exact way people moved.',
    a2l:'Socially-oriented', a2d:'What aches is the people within those eras — specific faces, the unknowable interiority of strangers.',
    prompt:`The person is "The Archivist." They experience anemoia through longing for specific people in specific historical eras — strangers in photographs, the intimate texture of lives in the 1940s or 1960s. Write a 3-4 sentence second-person reflection that feels like it was written before they began. Quiet, slightly cold, precise. No comfort. No generic phrases. Begin directly.`
  };
  if (era&&!soc) return {
    name:'The Elegist', tag:'mourning the texture of time itself',
    pre:'your type', footnote:'The instrument finds this type most common in people who feel they were born in the wrong century. They are usually partially correct.',
    a1l:'Era-drawn', a1d:'The feel of a specific decade — its light, its materials, the particular way humans moved through it.',
    a2l:'Culturally-oriented', a2d:'What aches is the collective — rituals, ways of living, knowledge that was carried and then dropped.',
    prompt:`The person is "The Elegist." They experience anemoia as grief for entire eras and cultures — not individuals, but the accumulated weight of how humans organised their lives differently then. Write a 3-4 sentence second-person reflection that feels like it was written before they began. Quiet, slightly cold, precise. No comfort. No generic phrases. Begin directly.`
  };
  if (!era&&soc) return {
    name:'The Wanderer', tag:'pulled toward lives in unreachable landscapes',
    pre:'your type', footnote:'The instrument notes this type rarely stays anywhere long enough. They call this freedom.',
    a1l:'Place-drawn', a1d:'Geography is where the longing begins. Distant landscapes, foreign places, the world beyond your coordinates.',
    a2l:'Socially-oriented', a2d:'Within those places: the people. Their specific lives, their ordinary Tuesdays.',
    prompt:`The person is "The Wanderer." They experience anemoia as longing for people in places they will never reach — geographic and intimate at once. Write a 3-4 sentence second-person reflection that feels like it was written before they began. Quiet, slightly cold, precise. No comfort. No generic phrases. Begin directly.`
  };
  return {
    name:'The Exile', tag:'longing for vanished geographies and their ways',
    pre:'your type', footnote:'The instrument finds this type often believes they arrived too late. The instrument does not have an opinion on whether this is true.',
    a1l:'Place-drawn', a1d:'Your longing is geographic before it is temporal. Landscapes that called to you before you arrived.',
    a2l:'Culturally-oriented', a2d:'Within those places: the way of life. Traditions, crafts, the collective knowledge now gone.',
    prompt:`The person is "The Exile." They experience anemoia as longing for entire ways of life rooted in specific places — vanished geographies, lost cultures. Write a 3-4 sentence second-person reflection that feels like it was written before they began. Quiet, slightly cold, precise. No comfort. No generic phrases. Begin directly.`
  };
}

// ── STATE ──────────────────────────────────────────────────────────────
let current=0, scores={a1:0,a2:0}, selected=null;

// ── DEPTH ──────────────────────────────────────────────────────────────
function setDepth(d) {
  const body=document.body;
  depthClasses.forEach(c=>body.classList.remove(c));
  body.classList.add(depthClasses[d]);
  for(let i=0;i<4;i++){
    const pip=document.getElementById('pip'+i);
    pip.classList.toggle('active', i===d);
  }
  document.getElementById('depth-indicator').classList.add('visible');
}

// ── TRANSITION ─────────────────────────────────────────────────────────
function transition(fn) {
  const ov=document.getElementById('overlay');
  ov.classList.add('on');
  setTimeout(()=>{ fn(); ov.classList.remove('on'); }, 550);
}
function staticFlash() {
  const s=document.getElementById('static');
  s.classList.add('pop');
  setTimeout(()=>s.classList.remove('pop'),200);
}
function show(id) {
  transition(()=>{
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    window.scrollTo(0,0);
  });
}

// ── FLOW ───────────────────────────────────────────────────────────────
function startTest() {
  current=0; scores={a1:0,a2:0}; selected=null;
  setDepth(0);
  renderQuestion();
  show('questions');
}

function renderQuestion() {
  const q=questions[current];
  selected=null;
  setDepth(q.depth);
  document.getElementById('prog').style.width=(current/questions.length*100)+'%';
  document.getElementById('qnum').textContent=(current+1)+' / '+questions.length;
  document.getElementById('qimg').innerHTML=svgs[q.svgKey]+'<div class="q-img-caption">'+q.caption+'</div>';
  const prompt=document.getElementById('qprompt');
  prompt.textContent=q.prompt;
  prompt.classList.toggle('glitch', q.depth>=3);
  document.getElementById('qhint').textContent=q.hint;
  const container=document.getElementById('choices');
  container.innerHTML='';
  q.choices.forEach(function(c,i){
    const btn=document.createElement('button');
    btn.className='choice'+(c.wrong?' wrong':'');
    btn.innerHTML='<div class="choice-key">'+c.label+'</div><div class="choice-body">'+c.text+'</div>';
    if(c.wrong){
      btn.onclick=function(){ staticFlash(); btn.style.opacity='0.25'; setTimeout(function(){btn.style.opacity='';},700); };
    } else {
      btn.onclick=function(){ selectChoice(i); };
    }
    container.appendChild(btn);
  });
  const next=document.getElementById('btn-next');
  next.classList.remove('visible');
  next.textContent=current===questions.length-1?'submit →':'continue →';
}

function selectChoice(idx) {
  selected=idx;
  document.querySelectorAll('.choice').forEach(function(el,i){
    if(!questions[current].choices[i].wrong) el.classList.remove('selected');
  });
  document.querySelectorAll('.choice')[idx].classList.add('selected');
  document.getElementById('btn-next').classList.add('visible');
}

function advance() {
  if(selected===null) return;
  const c=questions[current].choices[selected];
  scores.a1+=c.a1; scores.a2+=c.a2;
  current++;

  const interIdx=interstitialAfter.indexOf(current-1);
  if(interIdx!==-1 && current<questions.length) {
    const inter=interstitials[interIdx];
    const nextDepth=questions[current].depth;
    setDepth(nextDepth);
    document.getElementById('inter-line').innerHTML=inter.line.replace(/\n/g,'<br>');
    document.getElementById('inter-sub').textContent=inter.sub;
    show('interstitial');
    return;
  }

  if(current>=questions.length) showResult();
  else { selected=null; renderQuestion(); }
}

function resumeTest() {
  selected=null;
  renderQuestion();
  show('questions');
}

// ── RESULT ─────────────────────────────────────────────────────────────
async function showResult() {
  const type=getType(scores.a1,scores.a2);
  document.getElementById('result-pre').textContent=type.pre;
  document.getElementById('rname').textContent=type.name;
  document.getElementById('rtag').textContent=type.tag;
  document.getElementById('rfootnote').textContent=type.footnote;
  document.getElementById('raxes').innerHTML=
    '<div class="axis-card"><div class="axis-lbl">First axis</div><div class="axis-val">'+type.a1l+'</div><div class="axis-desc">'+type.a1d+'</div></div>'+
    '<div class="axis-card"><div class="axis-lbl">Second axis</div><div class="axis-val">'+type.a2l+'</div><div class="axis-desc">'+type.a2d+'</div></div>';
  show('result');

  try {
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:1000,
        messages:[{role:'user',content:type.prompt}]
      })
    });
    const data=await res.json();
    const text=data.content&&data.content.map(function(b){return b.text||'';}).join('')||'';
    document.getElementById('reflect-wrap').innerHTML='<p class="result-reflection">'+text.trim()+'</p>';
  } catch(e) {
    const fb={
      'The Archivist':"You have always found other people's photographs more affecting than your own memories. You tell yourself this is empathy. It may be something else — a hunger for interiority that your own life does not fully satisfy. The strangers in the photographs are not a substitute. They are the original longing.",
      'The Elegist':'You do not mourn people. You mourn the texture of time itself — the particular way light fell in a decade that ended before you arrived. This is a colder grief than most. It has no face to attach to. It does not go away when the objects of it are named.',
      'The Wanderer':'The longing you carry is geographic before it is anything else. It lives in distance. You have mistaken it for wanderlust. It is not. Wanderlust ends when you arrive. This does not end when you arrive. You have tested this.',
      'The Exile':'You believe you were made for a world that no longer exists. The instrument does not know if this is true. It notes only that you have believed it for longer than you have admitted, and that you have organised your life around the absence of something you cannot name.',
      'The Drifter':'You do not long for a time or a place or a person. You long for the longing. You have learned to mistake the sensation for nostalgia, for depth of feeling. It may be simpler than that. You are most yourself when you are reaching for something that cannot be reached. You have made this a home.'
    };
    document.getElementById('reflect-wrap').innerHTML='<p class="result-reflection">'+(fb[type.name]||fb['The Drifter'])+'</p>';
  }
}

function restart() {
  current=0; scores={a1:0,a2:0}; selected=null;
  setDepth(0);
  show('intro');
}
</script>
