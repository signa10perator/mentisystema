const ALL_TAGS = [...new Set(TIMELINE.flatMap(e => e.tags))].sort();

const ALL_ERAS = Object.keys(ERA_CONFIG);

const summaryKey = e => `${e.year}-${e.label}`;

const hasSummary = e => !!SUMMARIES[summaryKey(e)];

// HUD Panel





function HUDPanel({ entry, onClose }) {

const ec = ERA_CONFIG[entry.era] || {};

const color = ec.color || "#00e0b8";

const key = summaryKey(entry);

const summary = SUMMARIES[key];

const [page, setPage] = useState(0);

useEffect(() => setPage(0), [key]);

if (!summary) return null;

const cur = summary.pages[page];

const total = summary.pages.length;

return (

<div className="ms-hud-backdrop" onClick={onClose}>

<div className="ms-hud-panel" onClick={e => e.stopPropagation()}>

<div className="ms-hud-scan" />

{/* Corners */}

{["ms-corner-tl","ms-corner-tr","ms-corner-bl","ms-corner-br"].map(cls => (

<div key={cls} className={`ms-hud-corner ${cls}`} style={{ borderColor: color }} />

))}

{/* Corner dots */}

{[[12,12,"auto","auto"],[12,"auto",12,"auto"],["auto",12,12,"auto"],

["auto",12,"auto",12]].map(([t,b,l,r],i)=>(

<div key={i} className="ms-hud-dot"

style={{ top:t,bottom:b,left:l,right:r,background:color }} />

))}

<div className="ms-dot-border-v" style={{ left:0 }} />

<div className="ms-dot-border-v" style={{ right:0 }} /><div

style={{ position:"absolute",top:0,left:"50%",transform:"translateX(-50%)",width:1,height:10,ba

ckground:`linear-gradient(to bottom,${color},transparent)` }} />

{/* Header */}

<div className="ms-hud-header">

<div className="ms-hud-meta">

<span className="ms-hud-year" style={{ color }}>{entry.year}</span>

<div className="ms-hud-divider" />

<div style={{ flex:1 }}>

<div className="ms-hud-sub">{ec.label} Era · {entry.type}</div>

<div className="ms-hud-entry-title">{entry.label}</div>

</div>

<button className="ms-esc-btn" onClick={onClose}>ESC</button>

</div>

<div className="ms-dot-border-h" />

</div>

{/* Body */}

<div className="ms-hud-body">

{cur.paragraphs.map((p,i) => <p key={i}>{p}</p>)}

{cur.list && (

<div style={{ marginBottom:"1.4em" }}>

{cur.list.label && <div className="ms-list-label">{cur.list.label}</div>}

<ul>{cur.list.items.map((item,i)=><li key={i}>{item}</li>)}</ul>

</div>

)}

</div>

{cur.closingParagraphs?.map((p,i) => <p key={i}>{p}</p>)}

{/* Footer */}

<div className="ms-hud-footer">

<div className="ms-hud-footer-inner">

<button className="ms-nav-btn" onClick={()=>setPage(p=>p-1)}

disabled={page===0}>← Prev</button>

<div style={{ display:"flex",gap:8,alignItems:"center" }}>

{Array.from({length:total}).map((_,i)=>(

<div key={i} className="ms-page-pip" onClick={()=>setPage(i)}

style={{ width:i===page?20:6, background:i===page?color:undefined }} />

))}

<span className="ms-pg-label">{page+1} / {total}</span>

</div>

<button className="ms-nav-btn" onClick={()=>setPage(p=>p+1)}

disabled={page===total-1}>Next →</button>

</div>

</div>

<div

style={{ position:"absolute",bottom:0,left:"50%",transform:"translateX(-50%)",width:1,height:10

,background:`linear-gradient(to top,${color},transparent)` }} />

</div>

</div>

);}

// Main App





function Timeline() {

const [eras, setEras] = useState(new Set(ALL_ERAS));

const [tags, setTags] = useState(new Set());

const [query, setQuery] = useState("");

const [active, setActive] = useState(null);

const [reading, setReading] = useState(null);

const [view, setView] = useState("timeline");

const toggleEra = era => setEras(prev => {

const n = new Set(prev);

if (n.has(era)) { if (n.size > 1) n.delete(era); }

else n.add(era);

return n;

});

});

const toggleTag = tag => setTags(prev => {

const n = new Set(prev); n.has(tag) ? n.delete(tag) : n.add(tag); return n;

const filtered = TIMELINE.filter(e => {

if (!eras.has(e.era)) return false;

if (tags.size > 0 && !e.tags.some(t => tags.has(t))) return false;

if (query) {

const q = query.toLowerCase();

return e.label.toLowerCase().includes(q) || e.description.toLowerCase().includes(q) ||

e.tags.some(t=>t.includes(q));

}

return true;

}).sort((a,b)=>a.year-b.year);

// Update count in static HTML

useEffect(() => {

const el = document.getElementById('entry-count-display');

if (el) el.innerHTML = `ENTRIES<strong>${filtered.length}</strong>`;

}, [filtered.length]);

const EntryCard = ({ entry }) => {

const ec = ERA_CONFIG[entry.era] || {};

const col = ec.color || "#00e0b8";

const tc = typeColor(entry.type);

const isA = active?.label === entry.label && active?.year === entry.year;

const hasF = hasSummary(entry);

return (

<div>

{entry.milestone && <div className="ms-milestone">{entry.milestoneLabel}</div>}

<div className={`ms-entry-row ${isA?"active":""}`} onClick={()=>setActive(isA?null:entry)}

>

<div className="ms-dot" style={{ borderColor:col, color:col }} />

<div className="ms-card"><div style={{ display:"flex",alignItems:"center",gap:10,marginBottom:5 }}>

<span className="ms-year" style={{ color:col }}>{entry.year}</span>

<span className="ms-badge" style={{ borderColor:`${tc}55`,color:tc }}>{entry.type}</

span>

{hasF && <span className="ms-avail">◉ SUMMARY</span>}

</div>

<div className="ms-title">{entry.label}</div>

{isA && <>

<p className="ms-desc">{entry.description}</p>

<div className="ms-tags-row">{entry.tags.map(t=><span key={t} className="ms-

tag-mini">#{t}</span>)}</div>

{hasF && <button className="ms-read-btn"

onClick={e=>{e.stopPropagation();setReading(entry);}}>▶ Read Full Entry</button>}

</>}

</div>

</div>

</div>

);

};

const GridCard = ({ entry }) => {

const ec = ERA_CONFIG[entry.era] || {};

const col = ec.color || "#00e0b8";

const tc = typeColor(entry.type);

const isA = active?.label === entry.label && active?.year === entry.year;

const hasF= hasSummary(entry);

return (

<div className={`ms-grid-card ${isA?"active":""}`}

style={{ borderLeftColor: isA ? col : "transparent" }}

onClick={()=>setActive(isA?null:entry)}>

<div style={{ display:"flex",justifyContent:"space-between",alignItems:"flex-start" }}>

<span className="ms-grid-year" style={{ color:col }}>{entry.year}</span>

<span className="ms-badge" style={{ borderColor:`${tc}55`,color:tc,marginTop:3 }}

>{entry.type}</span>

</div>

<div className="ms-grid-title">{entry.label}</div>

{hasF && <div className="ms-avail" style={{ marginBottom:6 }}>◉ SUMMARY</div>}

{isA && <>

<p className="ms-desc" style={{ marginBottom:8 }}>{entry.description}</p>

{hasF && <button className="ms-read-btn"

onClick={e=>{e.stopPropagation();setReading(entry);}}>▶ Read Full Entry</button>}

</>}

</div>

);

};

return (

<>

<div className="ms-scan-page" />

{reading && <HUDPanel entry={reading} onClose={()=>setReading(null)} />}{/* Controls */}

<div className="ms-controls">

<div className="ms-row">

<div className="ms-search-wrap">

<svg className="ms-search-icon" width="13" height="13" viewBox="0 0 24 24"

fill="none" stroke="currentColor" strokeWidth="2">

<circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>

</svg>

<input className="ms-search" placeholder="Search entries, tags, descriptions…"

value={query} onChange={e=>setQuery(e.target.value)} />

</div>

<div style={{ display:"flex",gap:4 }}>

<button className={`ms-view-btn ${view==="timeline"?"active":""}`}

onClick={()=>setView("timeline")}>Timeline</button>

<button className={`ms-view-btn ${view==="grid"?"active":""}`}

onClick={()=>setView("grid")}>Grid</button>

</div>

</div>

<div className="ms-row" style={{ marginBottom:10 }}>

{ALL_ERAS.map(era=>{

const cfg = ERA_CONFIG[era];

const on = eras.has(era);

return (

<button key={era} className="ms-era-btn"

style={{ borderColor:on?cfg.color:"rgba(255,255,255,.08)", color:on?

cfg.color:"#475569",

background:on?`${cfg.color}11`:"transparent", opacity:on?1:.6 }}

onClick={()=>toggleEra(era)}>

{cfg.label} <span style={{ opacity:.55,fontSize:9 }}>{cfg.years}</span>

</button>

);

})}

</div>

<div style={{ display:"flex",flexWrap:"wrap",gap:6 }}>

{ALL_TAGS.map(tag=>(

<button key={tag} className={`ms-tag ${tags.has(tag)?"active":""}`}

onClick={()=>toggleTag(tag)}>{tag}</button>

))}

{tags.size > 0 && <button className="ms-tag clear" onClick={()=>setTags(new Set())}

>clear ×</button>}

</div>

</div>

{/* Timeline view */}

{view === "timeline" && (

<div className="ms-tl-wrap">

<div className="ms-tl-line" />

{filtered.map(e => <EntryCard key={`${e.year}-${e.label}`} entry={e} />)}

</div>

)}

{/* Grid view */}{view === "grid" && (

<div className="ms-grid-wrap">

{filtered.map(e => <GridCard key={`${e.year}-${e.label}`} entry={e} />)}

</div>

)}

</>

);

}

ReactDOM.createRoot(document.getElementById('timeline-root')).render(<Timeline />);

</script>
