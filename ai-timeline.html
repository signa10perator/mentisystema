      paragraphs: ["Claude Mythos occupies an interesting place in the history of artificial intelligence: part technical milestone, part governance exercise, and part carefully orchestrated narrative. Announced by Anthropic in April 2026, Mythos was presented as a frontier model so capable at discovering software vulnerabilities that it was deemed too risky for broad public release. The implication was clear: AI had crossed a threshold from helpful coding assistant to autonomous cyber operator.", "That may be true. It may also be, at least in part, a familiar performance.", "The announcement echoes the 2019 release of GPT-2, when OpenAI -- where Anthropic co-founder Jack Clark played a central role -- famously withheld the full model on the grounds that it was too dangerous to release. At the time, the move generated widespread debate. GPT-2 was genuinely impressive, but the secrecy also functioned as a powerful marketing device. Scarcity creates mystique. Restricted access implies significance.", "Mythos follows the same template.", "This does not mean Anthropic is being deceptive. Frontier models likely are becoming increasingly capable in offensive cybersecurity. Smaller and open-source models have already demonstrated substantial hacking ability. What remains uncertain is whether Mythos represents a discontinuous leap or simply a well-packaged incremental advance."],

  "1966-ELIZA - Joseph Weizenbaum": {
